<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Journey | Past Times</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --forest: #1d3c34; --cream: #f9f7f2; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--cream); }
        .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--forest); text-align: center; font-size: 3rem; }
        .journey-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 40px 0; }
        .card { background: white; border: 1px solid #ddd; padding: 15px; text-align: left; }
        .card img { width: 100%; height: 250px; object-fit: cover; filter: grayscale(100%); transition: 0.5s; }
        .card:hover img { filter: grayscale(0%); }
        .practices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 50px; }
        .practice-box { border: 1px solid #ccc; padding: 25px; background: rgba(255,255,255,0.6); }
        .practice-box h3 { font-family: 'Playfair Display', serif; color: var(--forest); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Journey</h1>
        <div class="journey-grid">
            <div class="card"><img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=400" alt="Journey"><h3>Looking Ahead</h3><p>April 14, 2026</p></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=400" alt="Inspiration"><h3>The Inspiration</h3><p>April 14, 2026</p></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1542060717-d7168925f6f3?w=400" alt="Community"><h3>Building Community</h3><p>April 14, 2026</p></div>
        </div>

        <h1>Our Sustainability Practices</h1>
        <div class="practices">
            <div class="practice-box"><h3>Curated Selection</h3><p>We ensure every piece meets our quality standards.</p></div>
            <div class="practice-box"><h3>Eco-Friendly Packaging</h3><p>Recyclable and biodegradable materials only.</p></div>
        </div>
    </div>
</body>
</html>
