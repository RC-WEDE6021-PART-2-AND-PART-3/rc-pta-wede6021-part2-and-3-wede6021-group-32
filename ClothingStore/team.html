<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meet The Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <style>
        body { margin:0; background: #1d3c34; color: white; font-family: 'Montserrat', sans-serif; text-align: center; }
        .wrapper { max-width: 1200px; margin: 0 auto; padding: 80px 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 50px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
        .member img { width: 100%; height: 300px; object-fit: cover; margin-bottom: 20px; }
        h3 { font-family: 'Playfair Display', serif; margin: 10px 0; }
        p { font-size: 0.9rem; opacity: 0.8; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Meet Our Passionate Team</h1>
        <div class="grid">
            <div class="member">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400">
                <h3>Jane Doe</h3>
                <p>Founder & Environmental Scientist.</p>
            </div>
            <div class="member">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400">
                <h3>John Smith</h3>
                <p>Operations Manager.</p>
            </div>
            <div class="member">
                <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400">
                <h3>Emily Davis</h3>
                <p>Community Liaison.</p>
            </div>
        </div>
    </div>
</body>
</html>
